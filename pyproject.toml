[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specops"
version = "0.1.0"
description = "Agent Reliability Kit — OTel-native toolkit for reliable, evaluatable, debuggable LLM agents in production"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SpecOps Contributors" }]
keywords = ["llm", "agents", "observability", "opentelemetry", "reliability", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/specops-kit/specops"
Documentation = "https://github.com/specops-kit/specops/tree/main/docs"
Repository = "https://github.com/specops-kit/specops"
Issues = "https://github.com/specops-kit/specops/issues"

# Package manager: uv (https://docs.astral.sh/uv/)
# Install deps: uv sync
# Add runtime dep: uv add <pkg>
# Add dev dep: uv add --dev <pkg>
# Run commands: uv run <cmd>

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/specops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
