[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specops-ai"
version = "0.4.6"
description = "Framework-agnostic, OTel-native toolkit for reliable, evaluatable, debuggable, and self-healing LLM agents in production"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "A-aron Paul Luminding", email = "luminding.aaron420@gmail.com" }
]
keywords = ["llm", "agents", "observability", "opentelemetry", "reliability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "crewai>=1.14.4",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "strands-agents>=1.39.0",
]

[project.scripts]
specops-demo = "specops_ai.demo:main"

[project.urls]
Homepage = "https://github.com/kripikroli/specops-ai"
Documentation = "https://github.com/kripikroli/specops-ai/tree/main/docs"
Repository = "https://github.com/kripikroli/specops-ai"
Issues = "https://github.com/kripikroli/specops-ai/issues"

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0", "langchain-core>=0.3.0"]
crewai = ["crewai>=0.80.0"]
autogen = [
    "autogen-ext[openai]>=0.7.5",
    "pyautogen>=0.10.0",
]
strands = ["strands-agents>=0.1.0"]
demo = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "websockets>=14.0"]
all = ["langgraph>=0.2.0", "langchain-core>=0.3.0", "crewai>=0.80.0", "pyautogen>=0.10.0", "strands-agents>=0.1.0"]

# Package manager: uv[](https://docs.astral.sh/uv/)
# Install deps: uv sync
# Add runtime dep: uv add <pkg>
# Add dev dep: uv add --dev <pkg>
# Run commands: uv run <cmd>

[dependency-groups]
dev = [
    "autogen-agentchat>=0.4.0",
    "autogen-ext[openai]>=0.4.0",
    "fastapi>=0.115.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.15.12",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/specops_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/specops_ai/demo.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
